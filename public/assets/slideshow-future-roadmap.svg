    </text>

    <!-- Sub-Pod A: The Squat Rack Bottleneck -->
    <rect x="35" y="130" width="780" height="150" fill="#0d0f11" stroke="#252a30" stroke-width="1.5" />
    <rect x="35" y="130" width="6" height="150" fill="#DC3545" />
    <text x="60" y="165" fill="#DC3545" font-family="'Oswald', sans-serif" font-weight="800" font-size="14" letter-spacing="2">
      CRITICAL BOTTLENECK DETECTED • 96.4% PEAK UTILIZATION
    </text>
    <text x="60" y="195" fill="#FFFFFF" font-family="'Oswald', sans-serif" font-weight="900" font-size="22">
      OLYMPIC POWER RACKS (ZONE: STRENGTH &amp; RACKS)
    </text>
    <text x="60" y="224" fill="#c4cad0" font-family="'Inter', sans-serif" font-size="13">
