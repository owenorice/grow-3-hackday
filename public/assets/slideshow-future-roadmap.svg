  <!-- ================= BOTTOM KEYNOTE FOOTER ================= -->
  <g transform="translate(80, 975)">
    <rect x="0" y="0" width="1760" height="50" fill="#0f1113" stroke="#2b3036" stroke-width="1" />
    <text x="30" y="31" fill="#7d8690" font-family="'Oswald', sans-serif" font-weight="700" font-size="14" letter-spacing="3">
      COMMERCIAL IMPACT:
    </text>
    <text x="210" y="31" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="600" font-size="13">
      Increases average member lifetime value (LTV) through eliminated peak-hour workout friction &amp; arms executive leadership with objective capex allocation data.
    </text>
    <text x="1650" y="31" fill="#97D700" font-family="'Oswald', sans-serif" font-weight="800" font-size="14" letter-spacing="2">
      Q4 2026 DEPLOYMENT
    </text>
