<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradients & Filters -->
    <radialGradient id="stadiumSpot" cx="50%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#97D700" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#000000" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="cyanSpot" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="neonVolt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="voltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#97D700" />
      <stop offset="100%" stop-color="#9FC63B" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181a1c" />
      <stop offset="100%" stop-color="#0d0e10" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22262a" stroke-width="1" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1920" height="1080" fill="#060708" />
  <rect width="1920" height="1080" fill="url(#gridPattern)" />
  <rect width="1920" height="1080" fill="url(#stadiumSpot)" />
  <rect width="1920" height="1080" fill="url(#cyanSpot)" />

  <!-- Outer Vignette & Precision Borders -->
  <rect x="24" y="24" width="1872" height="1032" fill="none" stroke="#262a2e" stroke-width="2" />
  <!-- Corner Brackets -->
  <path d="M 24 64 L 24 24 L 64 24" fill="none" stroke="#97D700" stroke-width="4" />
  <path d="M 1856 24 L 1896 24 L 1896 64" fill="none" stroke="#97D700" stroke-width="4" />
  <path d="M 24 1016 L 24 1056 L 64 1056" fill="none" stroke="#97D700" stroke-width="4" />
  <path d="M 1856 1056 L 1896 1056 L 1896 1016" fill="none" stroke="#97D700" stroke-width="4" />

  <!-- ================= TOP HEADER ================= -->
  <g transform="translate(80, 85)">
    <!-- Brand Tag -->
    <rect x="0" y="0" width="160" height="26" fill="#97D700" />
    <text x="80" y="18" fill="#000000" font-family="'Oswald', sans-serif" font-weight="900" font-size="13" text-anchor="middle" letter-spacing="2">
      PRODUCT ROADMAP
    </text>

    <text x="180" y="20" fill="#889096" font-family="'Inter', sans-serif" font-weight="700" font-size="13" letter-spacing="3">
      VILLAGE GYM INTELLIGENCE ECOSYSTEM // PHASE 4
    </text>

    <!-- Main Title -->
    <text x="0" y="80" fill="#FFFFFF" font-family="'Oswald', sans-serif" font-weight="900" font-size="52" letter-spacing="2">
      CAPEX TELEMETRY &amp; AI CIRCUIT OPTIMIZER
    </text>

    <text x="0" y="114" fill="#97D700" font-family="'Oswald', sans-serif" font-weight="700" font-size="20" letter-spacing="4">
      PREDICTIVE SENSING • FINANCIAL ROI JUSTIFICATION • ZERO-WAIT WORKOUT PATHING
    </text>

    <!-- Board Level Badge -->
    <rect x="1560" y="20" width="200" height="38" fill="#111315" stroke="#33373b" stroke-width="1.5" />
    <circle cx="1585" cy="39" r="6" fill="#97D700" filter="url(#neonVolt)" />
    <text x="1605" y="44" fill="#E0E0E0" font-family="'Oswald', sans-serif" font-weight="700" font-size="13" letter-spacing="2">
      EXECUTIVE SLIDE
    </text>
  </g>

  <!-- ================= LEFT PILLAR: FINANCIAL CAPEX EXPORT ================= -->
  <g transform="translate(80, 240)">
    <!-- Main Card Body -->
    <rect x="0" y="0" width="850" height="710" fill="url(#panelGrad)" stroke="#2b3036" stroke-width="2" />
    <!-- Pillar Header Bar -->
    <rect x="0" y="0" width="850" height="70" fill="#121416" stroke="#2b3036" stroke-width="2" />
    <rect x="0" y="0" width="12" height="70" fill="#97D700" />
    <text x="35" y="44" fill="#FFFFFF" font-family="'Oswald', sans-serif" font-weight="900" font-size="24" letter-spacing="2">
      01 // FINANCE CAPEX &amp; FLEET UTILIZATION ENGINE
    </text>
    <text x="700" y="44" fill="#97D700" font-family="'Inter', sans-serif" font-weight="800" font-size="13" letter-spacing="1">
