    <rect x="35" y="300" width="6" height="150" fill="#9FC63B" />
    <text x="60" y="335" fill="#9FC63B" font-family="'Oswald', sans-serif" font-weight="800" font-size="14" letter-spacing="2">
      UNDERUTILIZATION RECOVERY • 18.2% AVG CAPACITY
    </text>
