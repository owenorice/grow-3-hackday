    </text>
    <rect x="630" y="491" width="160" height="32" fill="#0f1f0a" stroke="#97D700" stroke-width="1" />
    <text x="710" y="512" fill="#97D700" font-family="'Oswald', sans-serif" font-weight="800" font-size="11" text-anchor="middle" letter-spacing="1">
      AVAILABLE NOW
    </text>

    <!-- Bottom Stat Banner -->
    <rect x="35" y="596" width="780" height="80" fill="#041217" stroke="#00e5ff" stroke-width="1.5" />
    <text x="65" y="632" fill="#FFFFFF" font-family="'Oswald', sans-serif" font-weight="900" font-size="22" letter-spacing="1">
      RESULT: 24 MINS SAVED PER WORKOUT SESSION
    </text>
    <text x="65" y="658" fill="#00e5ff" font-family="'Inter', sans-serif" font-weight="700" font-size="13">
