    <rect x="630" y="155" width="160" height="32" fill="#091b0c" stroke="#97D700" stroke-width="1" />
    <text x="710" y="176" fill="#97D700" font-family="'Oswald', sans-serif" font-weight="800" font-size="11" text-anchor="middle" letter-spacing="1">
      IN USE • SET 3 OF 4
    </text>

    <!-- Connecting Path Optimization Callout -->
    <g transform="translate(140, 248)">
      <line x1="0" y1="0" x2="0" y2="34" stroke="#00e5ff" stroke-width="2" stroke-dasharray="4,4" />
      <polygon points="-5,34 5,34 0,42" fill="#00e5ff" />
      <rect x="40" y="6" width="550" height="28" fill="#041a1f" stroke="#00e5ff" stroke-width="1" />
      <text x="55" y="25" fill="#00e5ff" font-family="'Oswald', sans-serif" font-weight="800" font-size="12" letter-spacing="1.5">
        ⚡ AI ROUTE ADJUSTMENT: Lat Pulldown busy (+16m wait) ➔ Swapped to Cable Cross
      </text>
    </g>

    <!-- Circuit Step 2: Dynamic Re-Order -->
    <rect x="35" y="298" width="780" height="110" fill="#0d0f11" stroke="#00e5ff" stroke-width="1.5" />
    <rect x="35" y="298" width="46" height="110" fill="#00e5ff" />
    <text x="58" y="360" fill="#000000" font-family="'Oswald', sans-serif" font-weight="900" font-size="18" text-anchor="middle">
      02
    </text>
    <text x="100" y="333" fill="#00e5ff" font-family="'Oswald', sans-serif" font-weight="800" font-size="13" letter-spacing="2">
      SMART QUEUE RECOMMENDATION • ZERO WAIT GUARANTEED
    </text>
    <text x="100" y="363" fill="#FFFFFF" font-family="'Oswald', sans-serif" font-weight="900" font-size="20">
      DUAL ADJUSTABLE CABLE CROSSOVER #01
    </text>
    <rect x="630" y="323" width="160" height="32" fill="#002f35" stroke="#00e5ff" stroke-width="1" />
    <text x="710" y="344" fill="#00e5ff" font-family="'Oswald', sans-serif" font-weight="800" font-size="11" text-anchor="middle" letter-spacing="1">
      READY IN 2 MINS
    </text>

    <!-- Connecting Path Biomechanical Equivalent Callout -->
    <g transform="translate(140, 416)">
      <line x1="0" y1="0" x2="0" y2="34" stroke="#97D700" stroke-width="2" stroke-dasharray="4,4" />
      <polygon points="-5,34 5,34 0,42" fill="#97D700" />
      <rect x="40" y="6" width="550" height="28" fill="#141c09" stroke="#97D700" stroke-width="1" />
      <text x="55" y="25" fill="#97D700" font-family="'Oswald', sans-serif" font-weight="800" font-size="12" letter-spacing="1.5">
        🔄 BIOMECHANICAL EQUIVALENT: Flat Bench in use ➔ Incline Dumbbell Bench #2 suggested
      </text>
    </g>

    <!-- Circuit Step 3: Biomechanical Fallback -->
    <rect x="35" y="466" width="780" height="110" fill="#0d0f11" stroke="#252a30" stroke-width="1.5" />
    <rect x="35" y="466" width="46" height="110" fill="#181c20" />
    <text x="58" y="528" fill="#97D700" font-family="'Oswald', sans-serif" font-weight="900" font-size="18" text-anchor="middle">
      03
    </text>
    <text x="100" y="501" fill="#97D700" font-family="'Oswald', sans-serif" font-weight="800" font-size="13" letter-spacing="2">
      EQUIVALENT STATION • AUTOMATIC SLOT HOLD
    </text>
    <text x="100" y="531" fill="#FFFFFF" font-family="'Oswald', sans-serif" font-weight="900" font-size="20">
