    <rect x="35" y="130" width="780" height="110" fill="#0d0f11" stroke="#252a30" stroke-width="1.5" />
    <rect x="35" y="130" width="46" height="110" fill="#181c20" />
    <text x="58" y="192" fill="#97D700" font-family="'Oswald', sans-serif" font-weight="900" font-size="18" text-anchor="middle">
      01
