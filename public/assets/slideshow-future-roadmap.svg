    </text>
    <rect x="60" y="410" width="730" height="28" fill="#13190a" stroke="#9FC63B" stroke-width="1" />
    <text x="75" y="429" fill="#D3F578" font-family="'Oswald', sans-serif" font-weight="700" font-size="12" letter-spacing="1">
