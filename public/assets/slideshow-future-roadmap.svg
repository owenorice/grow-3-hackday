    </text>
    <rect x="60" y="240" width="730" height="28" fill="#1b0e11" stroke="#DC3545" stroke-width="1" />
    <text x="75" y="259" fill="#FF707A" font-family="'Oswald', sans-serif" font-weight="700" font-size="12" letter-spacing="1">
